<style>
/* =====================================================================
   accessfood · prototipo web en un solo archivo
   Texto grande, contraste alto, áreas táctiles ≥ 48 px, foco visible.
   ===================================================================== */
:root {
  --fondo: #f4f5fb; --superficie: #fff; --superficie-2: #eef0f8; --texto: #161827; --texto-suave: #4b5168;

  --onda: #ffc531; --cubiertos: #e0115f; --franja: linear-gradient(180deg, #ff2d6f, #8e2de2);
  --cab: radial-gradient(circle at 8% 15%, #7b2ff7 0, transparent 40%), radial-gradient(circle at 92% 8%, #ff7a18 0, transparent 34%),
         radial-gradient(circle at 98% 95%, #ffb000 0, transparent 26%), linear-gradient(105deg, #8e2de2 0%, #d6246e 42%, #f0306f 62%, #f2552e 100%);
}

  --primario: #1650c8; --primario-oscuro: #0f3a94; --primario-claro: #e2ebff; --activo: #1650c8; --activo-fondo: #e2ebff;
  --onda: #7fe8ff; --cubiertos: #1650c8; --franja: linear-gradient(180deg, #00c6ff, #1d4ed8);

  --fondo: #fff; --superficie: #fff; --superficie-2: #fff; --texto: #000; --texto-suave: #1a1a1a; --borde: #000; --borde-fuerte: #000;
  --primario: #00267a; --primario-oscuro: #001a55; --primario-claro: #e6ecff; --activo: #00267a; --activo-fondo: #e6ecff;
  --cab: #000; --onda: #ffd400; --sombra: none;
}

/* ---------- Cabecera ---------- */

/* ---------- Estructura ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 1rem 1rem calc(7rem + env(safe-area-inset-bottom)); outline: none; }

.pie { text-align: center; color: var(--texto-suave); font-size: .8rem; padding: 0 1rem 1rem; }

.subtitulo { color: var(--texto-suave); }
.panel { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 1.15rem; box-shadow: var(--sombra); }
.panel + .panel { margin-top: 1rem; }

/* ---------- Botones y formularios ---------- */

/* ---------- Banners (Inicio y Favoritos) ---------- */
.banners { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 30rem), 1fr)); }
.banner { position: relative; display: grid; grid-template-columns: 1fr 46%; grid-template-rows: 100%; height: 8.2rem; border-radius: 22px; overflow: hidden; background: #140b06; box-shadow: var(--sombra); isolation: isolate; }

.banner__marca { grid-area: 1 / 2 / 2 / 3; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3rem; padding: 0 .6rem 0 1.9rem; text-align: center; color: var(--acento); }
.banner__enlace { color: inherit; text-decoration: none; }

.estilo-condensada .banner__nombre { font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", sans-serif; font-stretch: condensed; text-transform: uppercase; letter-spacing: .05em; }
.estilo-redonda .banner__nombre { font-family: "Trebuchet MS", Verdana, sans-serif; }

html.tema-azul .banner__marca { color: #fff; }

.portada .banner { height: 11rem; }
@media (min-width: 600px) { .portada .banner { height: 14rem; } }

.fav { position: absolute; z-index: 5; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; background: rgb(255 255 255 / .95); color: var(--activo); box-shadow: 0 2px 10px rgb(0 0 0 / .3); }
.fav .ico { width: 1.4rem; height: 1.4rem; }
.fav[aria-pressed="true"] .ico path { fill: currentColor; }
.fav[aria-pressed="true"] { animation: latir .35s ease; }

.banner .fav { top: .55rem; left: .9rem; }
.tras-banner { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem .9rem; margin: .55rem .2rem 0; }

.proxima__ico { display: grid; place-items: center; width: 2.6rem; height: 2.6rem; flex: none; border-radius: 50%; background: var(--primario-claro); color: var(--primario); }

/* ---------- Buscar ---------- */
.buscador { display: flex; align-items: center; gap: .4rem; padding: .3rem .3rem .3rem 1rem; background: var(--superficie); border: 1px solid var(--borde); border-radius: 999px; box-shadow: 0 6px 22px rgb(16 24 40 / .12); max-width: 46rem; margin: 0 auto .9rem; }

function distanciaKm(a, b) {
  const rad = (g) => (g * Math.PI) / 180, dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(h));
}

const proyectar = (lat, lng) => ({ x: ((lng - MAPA.lngMin) / (MAPA.lngMax - MAPA.lngMin)) * MAPA.W, y: ((MAPA.latMax - lat) / (MAPA.latMax - MAPA.latMin)) * MAPA.H });
const desproyectar = (x, y) => ({ lng: MAPA.lngMin + (x / MAPA.W) * (MAPA.lngMax - MAPA.lngMin), lat: MAPA.latMax - (y / MAPA.H) * (MAPA.latMax - MAPA.latMin) });

/* Mapa real (OpenStreetMap con Leaflet) cuando hay internet; si las teselas no cargan se usa el esquema. */
let mapaReal = null, sinTeselas = false;
const mapasActivos = [];   // mapas de Leaflet en pantalla; se destruyen al cambiar de vista
function cerrarMapas() { while (mapasActivos.length) { const m = mapasActivos.pop(); try { m.stop(); m.off(); m.remove(); } catch (_) {} } mapaReal = null; }
const puedeMapaReal = () => !!window.L && !sinTeselas && navigator.onLine !== false;
const puedeGPS = () => "geolocation" in navigator && window.isSecureContext && window.self === window.top;
const esquemaHTML = (idPines, pines = "") => `<svg aria-hidden="true">${DIBUJO_MAPA}</svg><div class="mapa__pines"${idPines ? ` id="${idPines}"` : ""}>${pines}</div>`;
function iniciarMapaReal(lienzo, { interactivo, alTocar, alFallar, centro = [19.0433, -98.1981], zoom = 14 }) {
  lienzo.innerHTML = "";
  const m = L.map(lienzo, { zoomControl: false, scrollWheelZoom: interactivo, dragging: true, keyboard: interactivo, fadeAnimation: false }).setView(centro, zoom, { animate: false });
  const capa = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(m);
  let cargadas = 0, errores = 0, caido = false;
  const fallar = () => { if (caido) return; caido = true; sinTeselas = true; setTimeout(() => { try { m.stop(); m.off(); m.remove(); } catch (_) {} const i = mapasActivos.indexOf(m); if (i >= 0) mapasActivos.splice(i, 1); lienzo.className = "mapa__lienzo"; alFallar(); }, 0); };
  capa.on("tileload", () => { cargadas += 1; });
  capa.on("tileerror", () => { errores += 1; if (errores >= 3 && cargadas === 0) fallar(); });
  setTimeout(() => { if (cargadas === 0 && document.body.contains(lienzo)) fallar(); }, 8000);
  if (alTocar) m.on("click", (e) => alTocar({ lat: e.latlng.lat, lng: e.latlng.lng }));
  mapasActivos.push(m);
  return m;
}

/* Mapa interactivo: arrastrar, acercar (rueda, pellizco o botones) y marcar ubicación. */
function crearMapa(contenedor, opciones) {
  const svg = contenedor.querySelector("svg");
  const capa = contenedor.querySelector(".mapa__pines");
  let vb = { x: 0, y: 0, w: MAPA.W, h: MAPA.H };
  const punteros = new Map();
  let inicio = null, movido = false;
  const tam = () => contenedor.getBoundingClientRect();
  function aplicar() {
    const r = tam(); if (!r.width || !r.height) return;
    vb.h = vb.w * (r.height / r.width);
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    capa.querySelectorAll("[data-lat]").forEach((el) => {
      const q = proyectar(Number(el.dataset.lat), Number(el.dataset.lng));
      el.style.left = `${((q.x - vb.x) / vb.w) * 100}%`; el.style.top = `${((q.y - vb.y) / vb.h) * 100}%`;
    });
  }
  function ajustar(puntos) {
    const r = tam(); if (!r.width) return;
    const xs = puntos.map((p) => proyectar(p.lat, p.lng));
    let minX = Math.min(...xs.map((p) => p.x)), maxX = Math.max(...xs.map((p) => p.x));
    let minY = Math.min(...xs.map((p) => p.y)), maxY = Math.max(...xs.map((p) => p.y));
    const margen = 70; minX -= margen; maxX += margen; minY -= margen; maxY += margen;
    let w = Math.max(maxX - minX, 420), h = Math.max(maxY - minY, 300);
    const asp = r.height / r.width;
    if (h / w > asp) w = h / asp; else h = w * asp;
    vb = { x: (minX + maxX) / 2 - w / 2, y: (minY + maxY) / 2 - h / 2, w, h };
    aplicar();
  }
  function zoom(f, cx, cy) {
    const r = tam(); if (!r.width) return; const px = cx ?? r.width / 2, py = cy ?? r.height / 2;

    });

}

function horarios(r, dia) {
  const hoy = ahora(); const d0 = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate());
  const h0 = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  if (d0 < h0) return [];
  const minimo = d0.getTime() === h0.getTime() ? hoy.getHours() * 60 + hoy.getMinutes() + 30 : 0;
  const lista = [];
  for (let m = aMin(r.abre); m <= aMin(r.cierra) - 60; m += 30) if (m >= minimo) lista.push(deMin(m));
  return lista;
}
function responderRestaurante(res) {
  const r = REST.get(res.restaurante), f = leer(res.fecha), min = f.getHours() * 60 + f.getMinutes();
  if (min < aMin(r.abre) || min >= aMin(r.cierra)) return ["RECHAZADA", `A esa hora el local está cerrado. Abrimos de ${r.abre} a ${r.cierra}.`];
  const ocupados = estado.reservas.filter((o) => o.id !== res.id && o.restaurante === r.id && o.fecha === res.fecha && o.estado === "CONFIRMADA").reduce((s, o) => s + o.personas, 0);
  const libres = r.cupo - ocupados;
  if (res.personas > libres) {
    return ["RECHAZADA", libres <= 0 ? `Ya no tenemos mesas disponibles a las ${horaTxt(f)}. Prueba con otro horario.` : `Solo nos quedan lugares para ${personasTxt(libres)} a las ${horaTxt(f)}. Prueba otro horario o menos personas.`];
  }
  const faltan = res.necesidades.filter((n) => !r.caract.includes(n));
  return ["CONFIRMADA", faltan.length ? `Te esperamos. Toma en cuenta que no contamos con: ${etiquetas(faltan)}.` : "¡Te esperamos! Prepararemos tu mesa según tus necesidades."];
}
function agregarAviso(tipo, titulo, cuerpo, reserva = null) {
  const a = { id: Date.now() + Math.random(), tipo, titulo, cuerpo, reserva, creado: isoFechaHora(ahora()), leido: false };
  estado.avisos.unshift(a); estado.avisos = estado.avisos.slice(0, 60);
  mostrarToast(a); return a;
}
/* Procesa respuestas del restaurante y recordatorios. Corre cada 2 s mientras la página está abierta. */
function procesar() {
  const t = ahora(); let cambio = false;
  estado.reservas.forEach((res) => {
    if (res.estado === "PENDIENTE" && res.respuestaEn && res.respuestaEn <= t.getTime()) {
      const r = REST.get(res.restaurante); const f = leer(res.fecha);
      const [nuevo, msg] = f <= t ? ["RECHAZADA", "El restaurante no respondió antes de la hora de la reserva."] : responderRestaurante(res);
      res.estado = nuevo; res.mensaje = msg; res.respuestaEn = null; res.confirmadaEn = t.getTime(); cambio = true;
      if (nuevo === "CONFIRMADA") agregarAviso("confirmada", "Reserva confirmada", `${r.nombre} confirmó tu reserva del ${fechaHoraLarga(f)} para ${personasTxt(res.personas)}.`, res.id);
      else agregarAviso("rechazada", "Reserva no disponible", `${r.nombre} no pudo aceptar tu reserva del ${fechaHoraLarga(f)}. ${msg}`, res.id);
    }
    if (res.estado === "CONFIRMADA" && estado.perfil.recordatorios) {
      const f = leer(res.fecha);
      estado.perfil.anticipaciones.forEach((k) => {
        const clave = `${res.id}-${k}`, en = f.getTime() - ANTICIPACIONES[k][0] * 60000;
        if (!estado.enviados[clave] && en <= t.getTime() && t < f && en >= (res.confirmadaEn || 0) - 60000) {
          estado.enviados[clave] = true; cambio = true;
          agregarAviso("recordatorio", "Recordatorio de tu reserva", `Tu reserva en ${REST.get(res.restaurante).nombre} es ${ANTICIPACIONES[k][2]}: ${fechaHoraLarga(f)}, ${personasTxt(res.personas)}.`, res.id);
        }
      });
    }
  });
  if (cambio) { guardar(); pintarCabecera(); if (["visitas", "inicio", "avisos"].includes(ruta().vista)) render(false); }
}
function estadisticas() {
  const t = ahora();
  const reservadas = estado.reservas.filter((r) => leer(r.fecha) > t && r.estado !== "RECHAZADA").length;
  const visitadas = estado.reservas.filter((r) => leer(r.fecha) <= t && r.estado === "CONFIRMADA").length;
  let corte = new Date(t.getFullYear(), t.getMonth(), DIA_CORTE);
  if (t.getDate() > DIA_CORTE) corte = new Date(t.getFullYear(), t.getMonth() + 1, DIA_CORTE);
  return { reservadas, visitadas, corte: `${corte.getDate()}-${mayus(MESES[corte.getMonth()].slice(0, 3))}` };
}
const perfilCompleto = () => estado.perfil.nombre.trim().length >= 3 && estado.perfil.telefono.trim().length > 0;
function validarPerfil(d) {
  const e = {}; const dig = d.telefono.replace(/\D/g, "");
  if (d.nombre.trim().length < 3) e.nombre = "Escribe tu nombre completo.";
  if (!d.telefono.trim()) e.telefono = "Escribe un teléfono para que el restaurante pueda contactarte.";
  else if (/[^0-9 +()-]/.test(d.telefono) || dig.length < 10 || dig.length > 15) e.telefono = "Escribe un teléfono de 10 a 15 dígitos, por ejemplo 222 123 4567.";
  if (!d.correo.trim()) e.correo = "Escribe tu correo electrónico.";
  else if (!/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(d.correo.trim())) e.correo = "El correo no es válido. Ejemplo: nombre@correo.com";
  if (d.recordatorios && !d.anticipaciones.length) e.anticipaciones = "Elige al menos un momento para el recordatorio.";
  return e;
}

      L.marker([r.lat, r.lng], { icon: L.divIcon({ className: "pin-contenedor", html: `<span class="pin" data-id="${r.id}" style="--pin:${r.color}">${contenidoPin(r)}</span>`, iconSize: [0, 0] }), title: r.nombre, alt: `${r.nombre}, ${r.calificacion} estrellas`, keyboard: true, riseOnHover: true })
        .on("click", () => fichaMapa(r.id)).addTo(grupo);
    });
    L.marker([u.lat, u.lng], { icon: L.divIcon({ className: "pin-contenedor", html: '<span class="pin-yo"></span>', iconSize: [0, 0] }), keyboard: false, interactive: false, zIndexOffset: -500 }).addTo(grupo);
    if (reajustar) m.fitBounds(L.latLngBounds([...lista.map(({ r }) => [r.lat, r.lng]), [u.lat, u.lng]]), { padding: [56, 56], maxZoom: 16, animate: false });
  } else {

    if (pines) pines.innerHTML = lista.map(({ r }) => `<button type="button" class="pin" data-accion="pin" data-id="${r.id}" data-lat="${r.lat}" data-lng="${r.lng}" style="--pin:${r.color}" aria-label="${esc(r.nombre)}, ${r.calificacion} estrellas">${contenidoPin(r)}</button>`).join("") +
      `<span class="pin-yo" data-lat="${u.lat}" data-lng="${u.lng}" title="Tu ubicación"></span>`;
    if (mapaBuscar) { if (reajustar) mapaBuscar.ajustar([...lista.map(({ r }) => r), u]); else mapaBuscar.aplicar(); }
  }
}
function fichaMapa(id) {
  const r = REST.get(id), u = ubicacion(), mapa = document.getElementById("mapa");
  mapa.querySelector(".ficha-mapa")?.remove();
  document.querySelectorAll(".pin.activo, .lugar.resaltado").forEach((e) => e.classList.remove("activo", "resaltado"));
  document.querySelector(`.pin[data-id="${id}"]`)?.classList.add("activo");
  document.querySelector(`.lugar[data-id="${id}"]`)?.classList.add("resaltado");
  const f = document.createElement("div"); f.className = "ficha-mapa"; f.setAttribute("role", "dialog"); f.setAttribute("aria-label", r.nombre);
  f.innerHTML = `<button class="ficha-mapa__cerrar" data-accion="cerrarFicha" aria-label="Cerrar">×</button><strong>${esc(r.nombre)}</strong><p>${esc(r.cocina)} · ★ ${r.calificacion.toFixed(1)} · ${distTxt(distanciaKm(u, r))}<br>${esc(r.direccion)}</p><div class="acciones"><a class="boton boton--secundario" href="#restaurante-${r.id}">Ver lugar</a><a class="boton boton--primario" href="#reservar-${r.id}">Reservar</a></div>`;
  mapa.appendChild(f);
}
function montarBuscar() {
  const mapaEl = document.getElementById("mapa"), lienzo = document.getElementById("lienzo");
  const alTocar = (pt) => {
    if (!marcando) { mapaEl.querySelector(".ficha-mapa")?.remove(); document.querySelectorAll(".pin.activo, .lugar.resaltado").forEach((e) => e.classList.remove("activo", "resaltado")); return; }
    estado.yo = { lat: pt.lat, lng: pt.lng }; marcando = false; guardar();
    mapaEl.classList.remove("marcando"); document.querySelector('[data-accion="marcar"]').setAttribute("aria-pressed", "false");
    document.getElementById("nota-mapa").textContent = "Ubicación marcada. Las distancias se calculan desde ese punto.";
    pintarResultados(false);
  };
  const usarEsquema = () => {
    mapaReal = null; lienzo.innerHTML = esquemaHTML("pines");
    mapaBuscar = crearMapa(lienzo, { interactivo: true, alTocar });
    document.getElementById("nota-mapa").textContent = "Mapa esquemático de Puebla (sin conexión al mapa real). Arrastra para moverte.";
    pintarResultados();
  };
  mapaBuscar = null; mapaReal = null;
  if (lienzo.getBoundingClientRect().width > 0) {
    if (puedeMapaReal()) {
      const m = iniciarMapaReal(lienzo, { interactivo: true, alTocar, alFallar: usarEsquema });
      mapaReal = { m, grupo: L.layerGroup().addTo(m) };
    } else mapaBuscar = crearMapa(lienzo, { interactivo: true, alTocar });
  }
  document.getElementById("q").addEventListener("input", (e) => { filtros.q = e.target.value; pintarResultados(); });
  document.getElementById("lugares").addEventListener("mouseover", (e) => { const li = e.target.closest(".lugar"); document.querySelectorAll(".pin.activo").forEach((x) => x.classList.remove("activo")); if (li) document.querySelector(`.pin[data-id="${li.dataset.id}"]`)?.classList.add("activo"); });
  pintarResultados();
  requestAnimationFrame(() => pintarResultados());
}

/* --- Reservar / editar --- */
let borrador = null;
function nuevoBorrador(r, res) {
  if (res) { const f = leer(res.fecha); return { restaurante: r.id, edita: res.id, dia: isoFecha(f), hora: horaTxt(f), personas: res.personas, necesidades: [...res.necesidades], notas: res.notas, errores: {} }; }
  let dia = new Date(); if (!horarios(r, dia).length) dia.setDate(dia.getDate() + 1);
  return { restaurante: r.id, edita: null, dia: isoFecha(dia), hora: "", personas: 2, necesidades: [...estado.perfil.necesidades], notas: "", errores: {} };
}
function formularioReserva(r, res) {
  const clave = `${r.id}-${res ? res.id : "n"}`;
  if (!borrador || borrador.clave !== clave) { borrador = nuevoBorrador(r, res); borrador.clave = clave; }
  const b = borrador, hoy = new Date(), dias = [];
  for (let i = 0; i < DIAS_RESERVA; i++) { const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + i); dias.push(d); }
  const horas = horarios(r, leer(b.dia)), completo = perfilCompleto();
  const etDia = (d, i) => i === 0 ? "Hoy" : i === 1 ? "Mañana" : DIAS[d.getDay()].slice(0, 3);
  const e = b.errores;
  return `<a class="volver" href="${res ? "#visitas" : "#restaurante-" + r.id}">${ico("volver")} ${res ? "Volver a mis visitas" : "Volver a " + esc(r.nombre)}</a>
  <div class="encabezado"><h1>${res ? "Modificar reserva" : "Reservar en " + esc(r.nombre)}</h1><p class="subtitulo">${res ? `Al guardar los cambios, ${esc(r.nombre)} volverá a confirmar tu reserva.` : "Completa los 4 pasos. El restaurante revisará tu solicitud y te avisaremos."}</p></div>
  ${Object.keys(e).length ? `<div class="mensaje mensaje--error" role="alert" tabindex="-1" id="errores">${ico("alerta")}<div><p><strong>No pudimos enviar la reserva:</strong></p><ul>${Object.values(e).map((x) => `<li>${x}</li>`).join("")}</ul></div></div>` : ""}
  ${completo ? "" : `<div class="mensaje mensaje--aviso" role="status">${ico("info")}<p>Para reservar necesitamos tu nombre y teléfono, así el restaurante puede contactarte. <a href="#perfil">Completar mi perfil</a>.</p></div>`}
  <div class="columnas"><div>
    <section class="panel"><h2 class="panel__titulo"><span class="paso" aria-hidden="true">1</span> ¿Qué día?</h2>
      <div class="dias" role="group" aria-label="Día de la visita">${dias.map((d, i) => `<button type="button" class="dia" data-accion="dia" data-dia="${isoFecha(d)}" aria-pressed="${b.dia === isoFecha(d)}" aria-label="${fechaLarga(d)}"><small>${etDia(d, i)}</small><strong>${d.getDate()}</strong><small>${MESES[d.getMonth()].slice(0, 3)}</small></button>`).join("")}</div></section>
    <section class="panel"><h2 class="panel__titulo"><span class="paso" aria-hidden="true">2</span> ¿A qué hora?</h2>
      <p class="ayuda">Horario del local (ejemplo): ${r.abre} a ${r.cierra}</p>
      <div class="horas" role="group" aria-label="Horarios disponibles">${horas.length ? horas.map((h) => `<button type="button" class="hora" data-accion="hora" data-hora="${h}" aria-pressed="${b.hora === h}">${h}</button>`).join("") : `<p class="ayuda">No quedan horarios para este día. Elige otro.</p>`}</div>
      ${e.hora ? `<p class="error">${e.hora}</p>` : ""}</section>
    <section class="panel"><h2 class="panel__titulo"><span class="paso" aria-hidden="true">3</span> ¿Cuántas personas?</h2>
      <div class="personas"><button type="button" class="redondo" data-accion="personas" data-paso="-1" aria-label="Quitar una persona" ${b.personas <= 1 ? "disabled" : ""}>−</button><output aria-live="polite">${b.personas}<span class="oculto"> ${b.personas === 1 ? "persona" : "personas"}</span></output><button type="button" class="redondo" data-accion="personas" data-paso="1" aria-label="Agregar una persona" ${b.personas >= MAX_PERSONAS ? "disabled" : ""}>+</button></div>
      <p class="ayuda" style="margin-top:.4rem">Incluyéndote. Máximo ${MAX_PERSONAS}.</p></section>
    <section class="panel"><h2 class="panel__titulo"><span class="paso" aria-hidden="true">4</span> Necesidades y notas</h2>
      <fieldset><legend>¿Qué necesitan en esta visita? <span class="ayuda">(marcamos las de tu perfil)</span></legend><div class="opciones opciones--2">
      ${Object.entries(CARACTERISTICAS).map(([k, t]) => `<label class="opcion"><input type="checkbox" data-campo="necesidad" value="${k}" ${b.necesidades.includes(k) ? "checked" : ""}><span>${t}${r.caract.includes(k) ? "" : "<small>El local no cuenta con esto (ejemplo)</small>"}</span></label>`).join("")}</div></fieldset>
      <div class="campo"><label for="notas">Notas para el restaurante <span class="ayuda">(opcional)</span></label><textarea id="notas" data-campo="notas" rows="3" maxlength="300" placeholder="Ej. Vamos con una persona en silla de ruedas y un bebé.">${esc(b.notas)}</textarea></div></section>
  </div>
  <aside class="panel"><h2 class="panel__titulo">Resumen</h2>${avisoProto(true)}
    <div class="mini-rest" style="--marca:${r.color};--acento:${r.acento}"><span class="inicial" aria-hidden="true">${esc(r.nombre[0])}</span><div><strong>${esc(r.nombre)}</strong><p class="ayuda" style="margin:0">${esc(r.direccion)}</p></div></div>
    <p class="resumen-linea" id="resumen">${mayus(fechaLarga(leer(b.dia)))}${b.hora ? " a las " + b.hora : " · falta elegir la hora"} · ${personasTxt(b.personas)}</p>
    <button type="button" class="boton boton--primario boton--ancho boton--grande" data-accion="enviarReserva" ${completo ? "" : "disabled"}>${ico("check")} ${res ? "Guardar cambios" : "Enviar solicitud"}</button>

  </aside></div>`;
}
VISTAS.reservar = (id) => { const r = REST.get(id); return r ? formularioReserva(r, null) : VISTAS.restaurante(id); };
VISTAS.editar = (id) => {
  const res = estado.reservas.find((x) => x.id === id);
  if (!res || leer(res.fecha) <= ahora()) return vacio("calendario", "Esta reserva ya no se puede modificar", "Puede que ya haya pasado o se haya eliminado.", `<a class="boton boton--primario" href="#visitas">Ir a Mis visitas</a>`);
  return formularioReserva(REST.get(res.restaurante), res);
};
function enviarReserva() {
  const b = borrador, r = REST.get(b.restaurante); b.errores = {};
  if (!perfilCompleto()) { location.hash = "#perfil"; return; }
  if (!b.hora) b.errores.hora = "Elige un horario.";
  else if (!horarios(r, leer(b.dia)).includes(b.hora)) b.errores.hora = "Ese horario ya no está disponible. Elige otro.";
  if (Object.keys(b.errores).length) { render(false); document.getElementById("errores")?.focus(); return; }
  const fecha = `${b.dia}T${b.hora}`, t = Date.now();
  if (b.edita) {
    const res = estado.reservas.find((x) => x.id === b.edita);
    Object.assign(res, { fecha, personas: b.personas, necesidades: [...b.necesidades], notas: b.notas.trim(), estado: "PENDIENTE", mensaje: null, respuestaEn: t + RESPUESTA_SEG * 1000, confirmadaEn: null });
    Object.keys(estado.enviados).filter((k) => k.startsWith(res.id + "-")).forEach((k) => delete estado.enviados[k]);
    flash = ["exito", "Cambios enviados. El restaurante revisará de nuevo tu reserva y te avisaremos."];
  } else {
    estado.reservas.push({ id: estado.siguiente++, restaurante: r.id, fecha, personas: b.personas, necesidades: [...b.necesidades], notas: b.notas.trim(), estado: "PENDIENTE", mensaje: null, respuestaEn: t + RESPUESTA_SEG * 1000, creada: t });
    flash = ["exito", `¡Solicitud enviada a ${r.nombre}! Te avisaremos aquí en cuanto el restaurante la confirme (en la demo tarda unos segundos).`];
  }
  borrador = null; guardar(); visitasPestana = "proximas"; location.hash = "#visitas";
}

/* --- Mis visitas --- */
let visitasPestana = "proximas", flash = null;
VISTAS.visitas = () => {

        ${res.necesidades.length ? `<p class="ayuda" style="margin:.2rem 0">Necesidades: ${etiquetas(res.necesidades)}</p>` : ""}${res.notas ? `<p class="ayuda" style="margin:.2rem 0">Notas: ${esc(res.notas)}</p>` : ""}
        ${res.mensaje ? `<p class="msg-rest"><strong>El restaurante dice:</strong> ${esc(res.mensaje)}</p>` : res.estado === "PENDIENTE" && esProx ? `<p class="ayuda esperando"><span class="punto" aria-hidden="true"></span>El restaurante está revisando tu solicitud.</p>` : ""}
        ${res.estado === "RECHAZADA" && esProx ? `<p class="ayuda">Puedes <strong>modificarla</strong> para elegir otro horario y enviarla de nuevo.</p>` : ""}</div>
      <div class="tarjeta-reserva__acciones"><span class="etiqueta etiqueta--${cls}" style="justify-content:center;padding:.4rem .8rem;border-radius:12px">${ico(ic)} ${txt}</span>
        ${esProx ? `<a class="boton boton--secundario" href="#editar-${res.id}">${ico("editar")} Modificar</a>` : `<a class="boton boton--secundario" href="#reservar-${r.id}">${ico("repetir")} Reservar de nuevo</a>`}
        <button type="button" class="boton boton--peligro" data-accion="eliminar" data-id="${res.id}">${ico("basura")} Eliminar<span class="oculto"> reserva en ${esc(r.nombre)}</span></button></div>
    </article></li>`;
  };
  return `<div class="encabezado"><h1>Mis visitas</h1><p class="subtitulo">Consulta, modifica o elimina tus reservas y revisa tus visitas anteriores.</p></div>
  <div class="pestanas" role="tablist" aria-label="Tipo de reservas"><button role="tab" data-accion="pestana" data-p="proximas" aria-selected="${esProx}">Próximas <span class="contador">${prox.length}</span></button><button role="tab" data-accion="pestana" data-p="historial" aria-selected="${!esProx}">Visitadas <span class="contador">${hist.length}</span></button></div>
  ${lista.length ? `<ul class="reservas" role="list">${lista.map(tarjeta).join("")}</ul>` : esProx ? vacio("calendario", "No tienes reservas próximas", "Busca un restaurante y reserva tu mesa.", `<a class="boton boton--primario" href="#buscar">${ico("buscar")} Buscar restaurantes</a>`) : vacio("calendario", "Aún no tienes visitas anteriores", "Aquí aparecerán tus reservas cuando haya pasado la fecha.")}`;
};

      ${campo("nombre", "Nombre completo", "text", "name", "")}${campo("telefono", "Teléfono", "tel", "tel", "222 123 4567")}${campo("correo", "Correo electrónico", "email", "email", "nombre@correo.com")}</section>
    <section class="panel"><h2 class="panel__titulo">¿Para quién son las reservas?</h2><p class="ayuda">Al elegir una opción marcamos sus necesidades más comunes; puedes ajustarlas abajo.</p>
      <div class="opciones opciones--2">${Object.entries(GRUPOS).map(([k, [t, sug]]) => `<label class="opcion"><input type="checkbox" name="grupos" value="${k}" data-sugiere="${sug.join(",")}" ${p.grupos.includes(k) ? "checked" : ""}><span>${t}</span></label>`).join("")}</div></section>
    <section class="panel"><h2 class="panel__titulo">${ico("accesible")} Mis necesidades</h2><p class="ayuda">Las usamos para mostrarte solo los lugares aptos y prellenar tus reservas.</p>
      <div class="opciones opciones--2">${Object.entries(CARACTERISTICAS).map(([k, t]) => `<label class="opcion"><input type="checkbox" name="necesidades" value="${k}" ${p.necesidades.includes(k) ? "checked" : ""}><span>${t}</span></label>`).join("")}</div></section>
    <section class="panel"><h2 class="panel__titulo">${ico("campana")} Recordatorios</h2>
      <label class="opcion"><input type="checkbox" name="recordatorios" ${p.recordatorios ? "checked" : ""}><span>Recibir recordatorios de mis reservas confirmadas</span></label>
      <fieldset id="anticipaciones" class="${p.recordatorios ? "" : "atenuado"}" style="margin-top:.8rem"><legend>¿Cuándo avisarte?</legend><div class="fila">${Object.entries(ANTICIPACIONES).map(([k, a]) => `<label class="opcion"><input type="checkbox" name="anticipaciones" value="${k}" ${p.anticipaciones.includes(k) ? "checked" : ""}><span>${a[1]}</span></label>`).join("")}</div>${e.anticipaciones ? `<p class="error">${e.anticipaciones}</p>` : ""}</fieldset>
      <p class="ayuda">Los avisos aparecen dentro de la app y en la campana mientras la página esté abierta.</p>
      <button type="button" class="boton boton--secundario" data-accion="prueba">${ico("campana")} Enviar aviso de prueba</button></section>
    <div class="guardar"><button type="submit" class="boton boton--primario boton--grande">${ico("check")} Guardar cambios</button></div>
  </form>
  <div>
    <section class="panel" style="text-align:center"><h2 class="panel__titulo">Foto de perfil</h2>
      <div class="foto">${p.foto ? `<img src="${p.foto}" alt="Tu foto de perfil">` : `${ico("usuario")}<span class="oculto">Sin foto de perfil</span>`}</div>
      <label class="boton boton--secundario boton--ancho archivo">${ico("camara")} ${p.foto ? "Cambiar foto" : "Elegir foto"}<input type="file" accept="image/*" data-campo="foto"></label>
      <p class="ayuda" style="margin-top:.4rem">Desde la galería o la cámara de tu teléfono.</p>
      ${p.foto ? `<button type="button" class="boton boton--texto" data-accion="quitarFoto">${ico("basura")} Quitar foto</button>` : ""}</section>
    <section class="panel"><h2 class="panel__titulo">Apariencia</h2>
      <fieldset><legend>Tema de color</legend><div class="fila">${[["VIBRANTE", "Vibrante", "linear-gradient(135deg,#8e2de2,#f0306f,#ffb000)"], ["AZUL", "Azul", "linear-gradient(135deg,#00c6ff,#1d4ed8)"]].map(([k, t, g]) => `<label class="opcion"><input type="radio" name="tema" data-campo="tema" value="${k}" ${p.tema === k ? "checked" : ""}><span><span class="muestra-tema" style="background:${g}" aria-hidden="true"></span>${t}</span></label>`).join("")}</div></fieldset>
      <fieldset><legend>Tamaño del texto</legend><div class="opciones">${[["NORMAL", "Normal", 1], ["GRANDE", "Grande", 1.12], ["MUY_GRANDE", "Muy grande", 1.25]].map(([k, t, s]) => `<label class="opcion"><input type="radio" name="texto" data-campo="texto" value="${k}" ${p.texto === k ? "checked" : ""}><span style="font-size:${s}em">${t}</span></label>`).join("")}</div></fieldset>
      <label class="opcion"><input type="checkbox" data-campo="contraste" ${p.contraste ? "checked" : ""}><span>Alto contraste<small style="color:var(--texto-suave);font-weight:400">Colores más marcados y bordes gruesos.</small></span></label></section>
    <section class="panel"><h2 class="panel__titulo">Datos de la demo</h2><p class="ayuda">Tus datos se guardan solo en este navegador.</p>
      <div class="acciones"><button type="button" class="boton boton--secundario" data-accion="demo">Cargar datos de demostración</button><button type="button" class="boton boton--peligro" data-accion="borrarTodo">${ico("basura")} Borrar todos mis datos</button></div></section>
  </div></div>`;
};
function guardarPerfil(form) {
  const fd = new FormData(form);
  const d = { nombre: (fd.get("nombre") || "").replace(/\s+/g, " ").trim(), telefono: (fd.get("telefono") || "").trim(), correo: (fd.get("correo") || "").trim(), grupos: fd.getAll("grupos"), necesidades: fd.getAll("necesidades"), recordatorios: fd.get("recordatorios") === "on", anticipaciones: fd.getAll("anticipaciones") };
  perfilErrores = validarPerfil(d);
  if (Object.keys(perfilErrores).length) {
    Object.assign(estado.perfil, d); render(false);
    mostrarToast({ tipo: "rechazada", titulo: "Revisa tus datos", cuerpo: "Hay campos marcados en rojo." }, 5000);
    document.querySelector('[aria-invalid="true"]')?.focus(); return;
  }
  Object.assign(estado.perfil, d); guardar(); render(false);
  mostrarToast({ tipo: "confirmada", titulo: "Perfil guardado", cuerpo: "Tus datos se guardaron correctamente." }, 4000);
}
function cargarFoto(archivo) {
  if (!archivo || !archivo.type.startsWith("image/")) { mostrarToast({ tipo: "rechazada", titulo: "Archivo no válido", cuerpo: "Elige una imagen (JPG, PNG, WEBP…)." }, 5000); return; }
  const img = new Image(), url = URL.createObjectURL(archivo);
  img.onload = () => {
    const lado = 320, c = document.createElement("canvas"); c.width = c.height = lado;
    const s = Math.min(img.width, img.height); c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, lado, lado);
    estado.perfil.foto = c.toDataURL("image/jpeg", 0.85); URL.revokeObjectURL(url); guardar(); pintarCabecera(); render(false);
    mostrarToast({ tipo: "confirmada", titulo: "Foto actualizada", cuerpo: "Tu foto de perfil se guardó." }, 4000);
  };
  img.onerror = () => mostrarToast({ tipo: "rechazada", titulo: "No pudimos leer la imagen", cuerpo: "Prueba con otra foto." }, 5000);
  img.src = url;
}

/* --- Avisos --- */
VISTAS.avisos = () => {
  const lista = estado.avisos;
  const html = `<div class="encabezado"><h1>Avisos</h1><p class="subtitulo">Confirmaciones de los restaurantes y recordatorios de tus reservas.</p></div>
  ${lista.length ? `<ul class="avisos" role="list">${lista.map((a) => `<li class="aviso aviso--${a.tipo}"><span class="aviso__ico">${ico({ confirmada: "check", rechazada: "equis", recordatorio: "reloj" }[a.tipo] || "campana")}</span><div><h2>${esc(a.titulo)}${a.leido ? "" : ' <span class="etiqueta etiqueta--info">Nuevo</span>'}</h2><p>${esc(a.cuerpo)}</p><p class="ayuda">${mayus(fechaHoraLarga(leer(a.creado)))}</p>${a.reserva ? `<a href="#visitas">Ver mis visitas</a>` : ""}</div></li>`).join("")}</ul>`
    : vacio("campana", "No tienes avisos todavía", "Cuando un restaurante responda a tu reserva, lo verás aquí.")}`;
  if (lista.some((a) => !a.leido)) { setTimeout(() => { lista.forEach((a) => { a.leido = true; }); guardar(); pintarCabecera(); }, 1500); }
  return html;
};

/* =====================================================================
   DATOS DE DEMOSTRACIÓN
   ===================================================================== */
function cargarDemo() {
  const hoy = new Date(), dia = (n, h) => { const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + n); return `${isoFecha(d)}T${h}`; };
  const t = Date.now();
  estado = estadoVacio();
  Object.assign(estado.perfil, { nombre: "María López Hernández", telefono: "222 123 4567", correo: "maria.lopez@correo.com", grupos: ["ADULTO_MAYOR"], necesidades: ["ACCESO_SIN_ESCALONES", "SILLAS_COMODAS", "MESA_CERCA_ENTRADA"] });
  estado.favoritos = [1, 12, 5];
  estado.reservas = [
    { id: 1, restaurante: 2, fecha: dia(1, "14:00"), personas: 3, necesidades: ["SILLAS_COMODAS", "MESA_CERCA_ENTRADA"], notas: "Celebramos el cumpleaños de mi mamá.", estado: "CONFIRMADA", mensaje: "¡Te esperamos! Prepararemos tu mesa según tus necesidades.", respuestaEn: null, confirmadaEn: t, creada: t },
    { id: 2, restaurante: 6, fecha: dia(3, "19:00"), personas: 8, necesidades: [], notas: "", estado: "PENDIENTE", mensaje: null, respuestaEn: t + 6000, creada: t },
    { id: 3, restaurante: 8, fecha: dia(5, "13:30"), personas: 2, necesidades: ["SILLAS_COMODAS"], notas: "", estado: "PENDIENTE", mensaje: null, respuestaEn: t + 12000, creada: t },
    { id: 4, restaurante: 1, fecha: dia(-6, "14:30"), personas: 4, necesidades: ["SILLAS_COMODAS"], notas: "", estado: "CONFIRMADA", mensaje: "¡Te esperamos! Prepararemos tu mesa según tus necesidades.", respuestaEn: null, confirmadaEn: t, creada: t },
    { id: 5, restaurante: 12, fecha: dia(-20, "13:00"), personas: 2, necesidades: [], notas: "", estado: "CONFIRMADA", mensaje: null, respuestaEn: null, confirmadaEn: t, creada: t },
  ];
  ["UN_DIA", "DOS_HORAS", "UNA_HORA"].forEach((k) => { estado.enviados[`4-${k}`] = true; estado.enviados[`5-${k}`] = true; });
  estado.siguiente = 6; guardar(); pintarCabecera();
  mostrarToast({ tipo: "prueba", titulo: "Datos de demostración cargados", cuerpo: "En unos segundos los restaurantes responderán a dos solicitudes pendientes." }, 6000);
  visitasPestana = "proximas"; location.hash === "#visitas" ? render() : (location.hash = "#visitas");
}

/* =====================================================================
   DIÁLOGOS
   ===================================================================== */
const dialogo = document.getElementById("dialogo");
function abrirDialogo(html, alAbrir) {
  dialogo.innerHTML = `<button type="button" class="dialogo__cerrar" data-cerrar aria-label="Cerrar">×</button>${html}`;
  dialogo.querySelectorAll("[data-cerrar]").forEach((b) => (b.onclick = () => dialogo.close()));
  if (typeof dialogo.showModal === "function") dialogo.showModal(); else dialogo.setAttribute("open", "");
  alAbrir?.(dialogo);
}
dialogo.addEventListener("click", (e) => { if (e.target === dialogo) dialogo.close(); });
function dialogoFiltros() {
  abrirDialogo(`<h2 id="dialogo-titulo">${ico("filtros")} Filtros de accesibilidad</h2><p class="ayuda">Muestra solo los lugares que cuentan con todo lo que marques (datos de ejemplo).</p>
    <div class="opciones">${Object.entries(CARACTERISTICAS).map(([k, t]) => `<label class="opcion"><input type="checkbox" value="${k}" ${filtros.c.includes(k) ? "checked" : ""}><span>${t}</span></label>`).join("")}</div>
    <div class="acciones" style="justify-content:space-between"><button type="button" class="boton boton--texto" data-limpiar>Quitar todo</button><button type="button" class="boton boton--primario" data-aplicar>Mostrar <span data-n></span> restaurantes</button></div>`, (d) => {
    const leerSel = () => [...d.querySelectorAll("input:checked")].map((i) => i.value);
    const contar = () => { const prev = filtros.c; filtros.c = leerSel(); d.querySelector("[data-n]").textContent = resultados().length; filtros.c = prev; };
    d.addEventListener("change", contar); contar();
    d.querySelector("[data-limpiar]").onclick = () => { d.querySelectorAll("input").forEach((i) => (i.checked = false)); contar(); };
    d.querySelector("[data-aplicar]").onclick = () => { filtros.c = leerSel(); d.close(); render(false); };
  });
}
function dialogoEliminar(id) {
  const res = estado.reservas.find((x) => x.id === id); if (!res) return;
  const r = REST.get(res.restaurante);
  abrirDialogo(`<h2 id="dialogo-titulo" style="color:var(--error)">${ico("alerta")} ¿Eliminar esta reserva?</h2><p><strong>${esc(r.nombre)}</strong><br>${mayus(fechaHoraLarga(leer(res.fecha)))} · ${personasTxt(res.personas)}</p><p class="ayuda">Esta acción no se puede deshacer.</p>
    <div class="acciones" style="justify-content:flex-end"><button type="button" class="boton boton--secundario" data-cerrar autofocus>No, conservarla</button><button type="button" class="boton boton--peligro-solido" data-si>${ico("basura")} Sí, eliminar</button></div>`, (d) => {
    d.querySelector("[data-si]").onclick = () => {
      estado.reservas = estado.reservas.filter((x) => x.id !== id); guardar(); d.close(); pintarCabecera(); render(false);
      mostrarToast({ tipo: "prueba", titulo: "Reserva eliminada", cuerpo: `Se eliminó la reserva en ${r.nombre}.` }, 4000);
    };
  });
}
function dialogoBorrarTodo() {
  abrirDialogo(`<h2 id="dialogo-titulo" style="color:var(--error)">${ico("alerta")} ¿Borrar todos tus datos?</h2><p>Se borrarán tu perfil, tu foto, tus reservas, favoritos y avisos de este navegador.</p>
    <div class="acciones" style="justify-content:flex-end"><button type="button" class="boton boton--secundario" data-cerrar autofocus>Cancelar</button><button type="button" class="boton boton--peligro-solido" data-si>Sí, borrar todo</button></div>`, (d) => {
    d.querySelector("[data-si]").onclick = () => { estado = estadoVacio(); perfilErrores = {}; guardar(); d.close(); pintarCabecera(); location.hash = "#inicio"; render(); };
  });
}

/* =====================================================================
   EVENTOS (delegados) Y RENDER
   ===================================================================== */
contenido.addEventListener("click", (e) => {
  const b = e.target.closest("[data-accion]"); if (!b) return;
  const a = b.dataset.accion, id = Number(b.dataset.id);
  switch (a) {
    case "fav": {
      const i = estado.favoritos.indexOf(id), r = REST.get(id);
      if (i >= 0) estado.favoritos.splice(i, 1); else estado.favoritos.unshift(id);
      guardar(); const es = i < 0;
      document.querySelectorAll(`.fav[data-id="${id}"]`).forEach((x) => { x.setAttribute("aria-pressed", String(es)); x.setAttribute("aria-label", `${es ? "Quitar" : "Guardar"} ${r.nombre} ${es ? "de" : "en"} favoritos`); });
      mostrarToast({ tipo: es ? "confirmada" : "prueba", titulo: es ? "Guardado en favoritos" : "Quitado de favoritos", cuerpo: r.nombre }, 3500);
      if (ruta().vista === "favoritos") render(false); else if (ruta().vista === "buscar" && filtros.fav) pintarResultados();
      break;
    }
    case "cat": filtros.cat = b.dataset.cat; render(false); break;
    case "aptos": filtros.aptos = !filtros.aptos; render(false); break;
    case "soloFav": filtros.fav = !filtros.fav; render(false); break;
    case "filtros": dialogoFiltros(); break;
    case "limpiar": Object.assign(filtros, { q: "", cat: "", aptos: false, fav: false, c: [], radio: 0 }); render(false); break;
    case "modo": filtros.modo = b.dataset.modo; render(false); break;
    case "zoom": if (mapaReal) (Number(b.dataset.f) < 1 ? mapaReal.m.zoomIn() : mapaReal.m.zoomOut()); else mapaBuscar?.zoom(Number(b.dataset.f)); break;
    case "gps": {
      b.disabled = true; document.getElementById("desde").textContent = "Buscando tu ubicación…";
      navigator.geolocation.getCurrentPosition((pos) => {
        b.disabled = false;
        const aqui = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (distanciaKm(aqui, { lat: 19.0433, lng: -98.1981 }) > 50) {
          mostrarToast({ tipo: "prueba", titulo: "Estás lejos de Puebla", cuerpo: `Seguimos calculando distancias desde ${ubicacion().nombre}. Puedes elegir una zona o marcar un punto en el mapa.` }, 7000);
        } else { estado.yo = { ...aqui, gps: true }; guardar(); }
        pintarResultados();
      }, () => {
        b.disabled = false; pintarResultados(false);
        mostrarToast({ tipo: "rechazada", titulo: "No pudimos obtener tu ubicación", cuerpo: "Revisa el permiso de ubicación del navegador, o elige una zona." }, 7000);
      }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
      break;
    }
    case "marcar": {
      marcando = !marcando; b.setAttribute("aria-pressed", String(marcando)); document.getElementById("mapa").classList.toggle("marcando", marcando);
      document.getElementById("nota-mapa").textContent = marcando ? "Toca en el mapa el lugar donde estás." : "Mapa esquemático de Puebla. Arrastra para moverte.";
      break;
    }
    case "pin": fichaMapa(id); break;
    case "cerrarFicha": b.closest(".ficha-mapa").remove(); document.querySelectorAll(".pin.activo, .lugar.resaltado").forEach((x) => x.classList.remove("activo", "resaltado")); break;
    case "dia": borrador.dia = b.dataset.dia; if (!horarios(REST.get(borrador.restaurante), leer(borrador.dia)).includes(borrador.hora)) borrador.hora = ""; render(false); break;
    case "hora": borrador.hora = b.dataset.hora; delete borrador.errores.hora; render(false); break;
    case "personas": borrador.personas = Math.min(MAX_PERSONAS, Math.max(1, borrador.personas + Number(b.dataset.paso))); render(false); document.querySelector(`[data-accion="personas"][data-paso="${b.dataset.paso}"]`)?.focus(); break;
    case "enviarReserva": enviarReserva(); break;
    case "pestana": visitasPestana = b.dataset.p; render(false); break;
    case "eliminar": dialogoEliminar(id); break;
    case "prueba": agregarAviso("prueba", "Avisos activados", "Así te avisaremos cuando el restaurante confirme tu reserva y antes de tu visita."); guardar(); pintarCabecera(); break;
    case "quitarFoto": estado.perfil.foto = null; guardar(); pintarCabecera(); render(false); break;
    case "demo": cargarDemo(); break;
    case "borrarTodo": dialogoBorrarTodo(); break;
  }
});
contenido.addEventListener("change", (e) => {
  const t = e.target, c = t.dataset.campo, p = estado.perfil;
  if (c === "radio") { filtros.radio = Number(t.value); pintarResultados(); }
  else if (c === "orden") { filtros.orden = t.value; pintarResultados(false); }
  else if (c === "zona") { if (t.value) { estado.zona = t.value; estado.yo = null; guardar(); pintarResultados(); t.value = ""; } }
  else if (c === "necesidad") { borrador.necesidades = t.checked ? [...borrador.necesidades, t.value] : borrador.necesidades.filter((x) => x !== t.value); }
  else if (c === "foto") cargarFoto(t.files[0]);
  else if (c === "tema" || c === "texto") { p[c] = t.value; guardar(); pintarCabecera(); }
  else if (c === "contraste") { p.contraste = t.checked; guardar(); pintarCabecera(); }
  else if (t.name === "grupos" && t.checked) { t.dataset.sugiere.split(",").forEach((k) => { const n = contenido.querySelector(`input[name="necesidades"][value="${k}"]`); if (n) n.checked = true; }); }
  else if (t.name === "recordatorios") document.getElementById("anticipaciones").classList.toggle("atenuado", !t.checked);
});
contenido.addEventListener("input", (e) => {
  if (e.target.dataset.campo === "notas") borrador.notas = e.target.value;
  const r = document.getElementById("resumen"); if (r && borrador) r.textContent = `${mayus(fechaLarga(leer(borrador.dia)))}${borrador.hora ? " a las " + borrador.hora : " · falta elegir la hora"} · ${personasTxt(borrador.personas)}`;
});
contenido.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.dataset.form === "perfil") guardarPerfil(e.target);
  if (e.target.dataset.form === "buscar") document.getElementById("q")?.blur();
});
document.querySelector("[data-saltar]").addEventListener("click", (e) => { e.preventDefault(); contenido.focus(); });

function render(navegar = true) {
  const { vista, id } = ruta();
  document.body.dataset.vista = vista;
  if (navegar) { mapaBuscar = null; marcando = false; if (vista !== "perfil") perfilErrores = {}; }
  const y = window.scrollY;
  let html = (VISTAS[vista] || VISTAS.inicio)(id);
  if (flash && vista === "visitas") { html = `<div class="mensaje mensaje--${flash[0]}" role="status">${ico("check")}<p>${esc(flash[1])}</p></div>` + html; flash = null; }
  cerrarMapas();
  contenido.innerHTML = html;
  pintarCabecera();
  if (vista === "buscar") montarBuscar();
  if (vista === "restaurante") montarDetalle(id);
  document.title = `${{ inicio: "Inicio", buscar: "Buscar restaurante", visitas: "Mis visitas", favoritos: "Favoritos", perfil: "Perfil", avisos: "Avisos", restaurante: REST.get(id)?.nombre || "Restaurante", reservar: "Reservar", editar: "Modificar reserva" }[vista]} · accessfood`;
  if (navegar) { window.scrollTo(0, 0); contenido.focus({ preventScroll: true }); } else window.scrollTo(0, y);
}
window.addEventListener("hashchange", () => render(true));
render(true);
procesar();
setInterval(procesar, 2000);
if ("serviceWorker" in navigator && location.protocol === "https:" && window.self === window.top) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
